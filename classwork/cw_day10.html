<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="#" />
    <title>JSON converter</title>
  </head>
  <body>
    <script>
      const person =
        '{"name":"misabahudeen","email":"misabah.in05@gmail.com","message":"this is a test message"}';

      // let converted = JSON.parse(person);
      console.log(person);
      const messageOut = (object) => object.name;

      try {
        const converted = JSON.parse(person);
        console.log(converted);
        console.log("Message recieved from " + messageOut(converted));
      } catch (err) {
        console.log(`The error message is ${err}`);
      }
    </script>
  </body>
</html>
