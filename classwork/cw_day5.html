<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item return page</title>
  </head>
  <body>
    <p id="displayResultOutput"></p>
    <p id="checkNameExistOutput"></p>
    <p id="deletedPropertyOutput"></p>
    <button onclick="displayResult()">Button</button>
    <script>
      let order = {
        itemName: "headPhone",
        isDelivered: true, //mistake . refer laast
        daysSinceDelivery: 5,
      };
      let eligiblePeriod = order.daysSinceDelivery <= 7;
      let isDelivered = order.isDelivered;

      let eligibleReturn =
        eligiblePeriod == isDelivered
          ? "Eligible for return"
          : "Return period expired";
      let nameToBoolean = Boolean(order.itemName);
      let checkNameExist =
        nameToBoolean == true
          ? "Name property exist in the object"
          : "name property is missing in the object";

      function displayResult() {
        document.getElementById("displayResultOutput").innerHTML =
          eligibleReturn;
        console.log(eligibleReturn);

        document.getElementById("checkNameExistOutput").innerHTML =
          checkNameExist;
        console.log(checkNameExist);

        delete order.daysSinceDelivery;
        console.log(order);
        document.getElementById("deletedPropertyOutput").innerHTML =
          'Property "daysSinceDelivery" is deleted';
      }
    </script>
  </body>
</html>
