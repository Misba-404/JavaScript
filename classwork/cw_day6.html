<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery store</title>
  </head>
  <body>
    <p id="demo"></p>
    <p id="demo2"></p>
    <script>
      let txt = "";
      let productArray = [
        "Product:Apple-Price:50",
        "Product:Orange-Price:60",
        "Product:Grapes-Price:40",
        "Product:Peach-Price:70",
      ];
      let filtered = productArray.filter(over50);

      function over50(value) {
        price = Number(value.split("Price:")[1]);
        return price > 50;
      }
      

      document.getElementById("demo").innerHTML = filtered.join("<br>");

      productArray.push("Product:Watermelon-Price:80");
      console.log(productArray);  
      document.getElementById("demo2").innerHTML = productArray.join("<br>");
    </script>
  </body>
</html>
