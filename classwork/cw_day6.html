<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery store</title>
  </head>
  <body>
    <h3>Products with price greater than 50</h3>
    <p id="demo"></p>

    <h3>Updated Product List</h3>
    <p id="demo2"></p>
    <script>
      let txt = "";
      let updatedProducts = "";
      let productArray = [
        "Product:Apple-Price:50",
        "Product:Orange-Price:60",
        "Product:Grapes-Price:40",
        "Product:Peach-Price:70",
      ];
      let filtered = productArray.filter(over50);
      filtered.forEach(displayFn);
      document.getElementById("demo").innerHTML = txt;

      function over50(value) {
        let price = Number(value.split("Price:")[1]);
        return price > 50;
      }

      function displayFn(value) {
        txt = txt + value + "<br>";
      }

      productArray.push("Product:Watermelon-Price:80");
      // productArray.forEach(displayFn);

      productArray.forEach(displayFn2);
      document.getElementById("demo2").innerHTML = updatedProducts;

      function displayFn2(value) {
        updatedProducts = updatedProducts + value + "<br>";
      }
    </script>
  </body>
</html>
