<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery Calculator</title>
  </head>
  <p></p>
  <body>
    <script>
      let product;
      let price = 0;
      let validPurchase = 0;
      let totalPrice = 0;
      while (validPurchase < 5) {
        let code = Number(
          prompt(
            "Enter Product code (1-3) \nPrice: Apple(1)=30, Banana(2)=10, Mango(3)=50",
          ),
        );
        let quantity = Number(prompt("Enter quantity"));
        // console.log("before switch" + validPurchase);

        switch (code) {
          case 1:
            product = "Apple";
            price = 30;
            break;
          case 2:
            product = "Banana";
            price = 10;
            break;
          case 3:
            product = "Mango";
            price = 50;
            break;
          default:
            console.log("Invalid code");
            continue;
        }
        itemTotal = price * quantity;
        totalPrice += itemTotal;
        console.log("Total Price :" + totalPrice);

        validPurchase += 1;
        // console.log("after purchase" + validPurchase);
        if (totalPrice > 100) {
          console.log("High purchase");
        } else {
          console.log("Low  purchase");
        }
      }
    </script>
  </body>
</html>
