<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic User comment system</title>
    <link rel="icon" href="#">
  </head>
  <body>
    <script>
      let comment =
        "My son is 12 years old. Our flat number is 45 and contact is 9876543210.";
      let pattern = /\d+/gi;
      console.log("Initial Comment:\n"+comment);
      console.log(comment.match(pattern));
      console.log(comment.replace(pattern,"NUMBER"));
      console.log(pattern.test(comment));
    </script>
  </body>
</html>
