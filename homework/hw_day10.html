<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="#" />
    <title>Json to object</title>
  </head>
  <body>
    <script>
      const userFeedback = `{"message":"The hospitality and service provided was very nice Thank you very much"}`;
      //
      let pattern = /Thank/gi;
      //   fn
      const checkThank = (string) => {
        let checkStatus = pattern.test(string);
        if (checkStatus == true) {
          console.log("Positive feedback recieved");
        } else {
          console.log("Feedback Noted");
        }
      };
      //   try catch
      try {
        const converted = JSON.parse(userFeedback);
        const messageOut = converted.message;
        checkThank(messageOut);
      } catch (err) {
        console.log(`Eroor occured is: ${err.message}`);
      }
    </script>
  </body>
</html>
