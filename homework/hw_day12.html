<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="#" />
    <title>Feedback Page</title>
  </head>
  <body>
    <form id="form1">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Your full name here" /><br />
      <label for="textbox">Enter your comments Below:</label><br />
      <textarea
        id="textbox"
        placeholder="Enter Your Feedbacks Here..."
      ></textarea
      ><br />
      <button id="btn" type="submit">submit</button>
    </form>
    <br />
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="message"></p>
    <script>
      let form = document.getElementById("form1");
      //   shprtcut for doc.gete]ElbyId
      let message = document.getElementById("message");
      let demo1 = document.getElementById("demo1");
      let demo2 = document.getElementById("demo2");
      form.addEventListener("submit", function () {
        event.preventDefault();
        let name = document.getElementById("name").value;
        let feedback = document.getElementById("textbox").value;
        document.getElementById("demo1").innerHTML = `Name: ${name}`;
        document.getElementById("demo2").innerHTML = `Feedback: ${feedback}`;
        message.innerHTML = "Thanks for your feedback";
        message.style.color = "green";
        setTimeout(function () {
          message.innerHTML = "";
        }, 5000);
      });
      demo2.addEventListener("mouseover", function () {
        demo2.style.color = "blue";
      });
      demo2.addEventListener("mouseout", function () {
        demo2.style.color = "black";
      });
    </script>
  </body>
</html>
