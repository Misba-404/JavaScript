<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Result Dashboard</title>
  </head>
  <body>
    <p id="name">display name</p>
    <p id="above60"></p>
    <script>
      let student = [
        { name: "jonathan", score: 85 },
        { name: "alan", score: 40 },
        { name: "askhay", score: 10 },
        { name: "abhishek", score: 70 },
        { name: "suraj", score: 25 },
        { name: "hari", score: 95 },
      ];

      let names = student.map(nameOnly);
      function nameOnly(person) {
        return person.name;
      }
      document.getElementById("name").innerHTML = "Student Names: " + names;

      let above60 = student.filter(fltr);
      function fltr(value) {
        return value.score > 60;
      }
      above60 = above60.map(nameOnly);

      console.log(above60);

      document.getElementById("above60").innerHTML = "Students with score above 60: "+above60;
    </script>
  </body>
</html>
