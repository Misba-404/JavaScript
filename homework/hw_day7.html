<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Reminder</title>
  </head>
  <body>
    <form>
      <label for="pastDate">Enter Your Past Bday Date: </label>
      <input type="date" id="pastDate" />
      <button id="button" type="button">submit</button>
      <p id="displayOut"></p>
    </form>
    <script>
      let button = document.getElementById("button");

      button.addEventListener("click", function showDate() {
        let eventDateString = document.getElementById("pastDate").value;
        let eventDate = new Date(eventDateString);
        console.log(eventDate);
        const months = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];
        const weekDay = [
          "Sunday",
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
        ];
        //   let displayYear=eventDate.getFullYear()
        console.log(months.length);
        document.getElementById("displayOut").innerHTML =
          "Your Entered Date is : " +
          eventDate.getFullYear() +
          " " +
          months[eventDate.getMonth()] +
          " " +
          weekDay[eventDate.getDay()];

        let today = new Date();
        let yearDifference = today.getFullYear() - eventDate.getFullYear();
        console.log(yearDifference);
        
        

        //
      });
    </script>
  </body>
</html>
