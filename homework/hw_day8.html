<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Input Sytem</title>
  </head>
  <body>
    <script>
      let chance = 5;
      for (let i = 0; i < chance; i++) {
        let guessNumber = parseInt(prompt("Enter a number between (1-5) "));
        if (guessNumber <= 5 && guessNumber >= 1) {
          switch (guessNumber) {
            case 1:
              console.log("You entered One");
              break;
            case 2:
              console.log("You entered Two");
              break;
            case 3:
              console.log("You entered Three");
            case 4:
              console.log("You entered Four");
            case 5:
              console.log("You entered Five");
            default:
              console.log("Unknown Errorrr");
          }

          if (guessNumber == 3) {
            console.log("You guessed it right");
            break;
          } else {
            console.log("Wrong Guess try again");
          }
        } else {
          console.log("invalid Input");
          continue;
        }

        console.log(i);
        if (i == 4 && guessNumber != 3) {
          console.log("GAME OVER");
        }
      }
    </script>
  </body>
</html>
