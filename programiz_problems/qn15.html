<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="#" />
    <title>factorial</title>
  </head>
  <body>
    <script>
      let number = 4;
      factorial = 1;
      for (i = 1; i <= number; i++) {
        factorial = factorial * i;
      }
      console.log(`Factorial of ${number} is ${factorial}`);
    </script>
  </body>
</html>
