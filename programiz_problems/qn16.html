<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="#" />
    <title>Multiplication table</title>
  </head>
  <body>
    <script>
      let number = Number(
        prompt("Enter the number for the mulitplication table to display"),
      );
      for (i = 1; i <= 10; i++) {
        console.log(`${i} x ${number} = ${i * number}`);
      }
    </script>
  </body>
</html>
