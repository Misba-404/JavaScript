<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fibonacci series</title>
  </head>
  <body>
    <script>
      let number = Number(prompt("Enter number of terms :"));
      let n1 = 0;
      let n2 = 1;
      let nextNum;
      for (i = 1; i <= number; i++) {
        console.log(n1);
        nextNum = n1 + n2;
        n1 = n2;
        n2 = nextNum;
      }
    </script>
  </body>
</html>
