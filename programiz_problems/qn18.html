<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amstrong number</title>
  </head>
  <body>
    <script>
      let number = Number(prompt("Enter a 3 digit number: "));
      let temp = number;
      let sum = 0;
      // console.log(`Before cutting last value: ${temp}`);
      while (temp > 0) {
        let remainder = temp % 10;
        // console.log(`remainder : ${remainder}`);
        sum += remainder * remainder * remainder;
        temp = parseInt(temp / 10);
        // console.log(`after cutting last digit : ${temp}`);
      }
      if (sum == number) {
        console.log(`${number} is Amstrong`);
      } else {
        console.log(`${number} is Not an Amstrong`);
      }
    </script>
  </body>
</html>
