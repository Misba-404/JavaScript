<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armstrong numbers between 2 intervals</title>
  </head>
  <body>
    <script>
      let low = Number(prompt("Enter the lower number:"));
      let high = Number(prompt("Enter the hightst numebr:"));
      for (let i = low; i <= high; i++) {
        let digitCount = i.toString().length;
        let sum = 0;
        let temp = i;
        while (temp > 0) {
          let remainder = temp % 10;
          sum += remainder ** digitCount;
          temp = parseInt(temp / 10);
        }
        if (sum == i) {
          console.log(` Number ${i} is an Armstrong`);
        }
      }
    </script>
  </body>
</html>
