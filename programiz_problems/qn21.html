<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="#">
    <title>Sum of natural numbers</title>
  </head>
  <body>
    <script>
      const number = Number(prompt("Enter the 'n' natural number for sum"));
      let sum = 0;
      for (i = 1; i <= number; i++) {
        sum += i;
      }
      console.log(`sum of first ${number} natural numbers is ${sum}`);
    </script>
  </body>
</html>
