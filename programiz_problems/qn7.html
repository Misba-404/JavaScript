<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convert Kilo-Meter to Miles</title>
  </head>
  <body>
    <script>
      let km = Number(prompt("Enter Km to convert to:"));
      let miles = km * 0.621371;
      console.log(`${km} kilometers is ${Math.round(miles)} Miles`);
    </script>
  </body>
</html>
